<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Fast Map: a folded world map flying open, with speed lines behind it,
       a dashed route and a quest pin ("!") on it.
       Palette as Alt Courier's icon: navy, teal, pastel pink, yellow and tan. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>

  <!-- speed lines, left of the map -->
  <g fill="none" stroke="#F4A7B9" stroke-width="16" stroke-linecap="round">
    <path d="M 40 196 H 96"/>
    <path d="M 22 268 H 96"/>
    <path d="M 52 340 H 96"/>
  </g>

  <!-- the map: three panels folded like a leaflet, slightly tilted -->
  <g transform="rotate(-6 300 280)">
    <path d="M 128 152 L 232 120 L 352 152 L 456 120 V 384 L 352 416 L 232 384 L 128 416 Z"
          fill="#15202E" stroke="#5BE0C8" stroke-width="16" stroke-linejoin="round"/>
    <!-- the middle panel, a shade back -->
    <path d="M 232 120 L 352 152 V 416 L 232 384 Z" fill="#1E3040"/>
    <g fill="none" stroke="#5BE0C8" stroke-width="16" stroke-linecap="round">
      <path d="M 232 128 V 380"/>
      <path d="M 352 160 V 408"/>
    </g>
    <!-- the route: tan dashes to the pin -->
    <path d="M 168 360 C 210 330 220 290 268 290 C 316 290 320 250 360 236"
          fill="none" stroke="#D9B48F" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
    <!-- the quest pin: a yellow drop with an "!" -->
    <path d="M 404 278 C 374 236 360 214 360 190 A 44 44 0 0 1 448 190 C 448 214 434 236 404 278 Z"
          fill="#F6D98B" stroke="#15202E" stroke-width="10" stroke-linejoin="round"/>
    <g fill="none" stroke="#15202E" stroke-linecap="round">
      <path d="M 404 166 V 198" stroke-width="14"/>
    </g>
    <circle cx="404" cy="222" r="8" fill="#15202E"/>
  </g>
</svg>
