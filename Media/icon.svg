<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Fast Map: a folded map with a pink pin, and teal speed chevrons: it opens at once. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <g fill="#15202E" stroke="#F6D98B" stroke-width="16" stroke-linejoin="round">
    <polygon points="70,130 170,96 270,130 370,96 370,382 270,416 170,382 70,416"/>
  </g>
  <g fill="none" stroke="#F6D98B" stroke-width="10" stroke-linecap="round">
    <path d="M 170 110 V 368"/><path d="M 270 144 V 402"/>
  </g>
  <!-- the pin -->
  <path d="M 220 300 C 186 252 178 236 178 214 A 42 42 0 0 1 262 214 C 262 236 254 252 220 300 Z" fill="#F4A7B9"/>
  <circle cx="220" cy="214" r="14" fill="#15202E"/>
  <!-- speed: two open chevrons, round ends -->
  <g fill="none" stroke="#5BE0C8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="398,196 442,256 398,316"/>
    <polyline points="438,196 482,256 438,316"/>
  </g>
</svg>
